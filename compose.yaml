services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: plukk
      POSTGRES_USER: plukk
      POSTGRES_PASSWORD: plukk
    ports:
      - "5432:5432"
    volumes:
      - plukk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plukk -d plukk"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  plukk-postgres-data:
