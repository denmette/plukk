<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Plukk offline</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f5f0e8;
            color: #1f2933;
        }

        main {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        section {
            max-width: 28rem;
            background: #fffdf9;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 16px 40px rgba(31, 41, 51, 0.12);
        }
    </style>
</head>
<body>
<main>
    <section>
        <h1>Plukk is offline</h1>
        <p>Your latest visible shopping information may still be useful, but new changes are not
            confirmed until the connection returns.</p>
    </section>
</main>
</body>
</html>
